<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>万古长空 · 中华全贤邮局</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@300;600;900&display=swap');
        :root { 
            --paper: #e8d9b5; 
            --ink: #1a1a1a; 
            --gold: #b8860b; 
            --bg: #0a0704; 
        }
        body, html { 
            margin: 0; 
            padding: 0; 
            height: 100%; 
            background: var(--bg); 
            font-family: 'Noto Serif SC', serif; 
            color: #d4c4a8; 
            overflow: hidden; 
        }
        .container { 
            display: flex; 
            height: 100vh; 
        }
        .sidebar { 
            width: 320px; 
            background: #120d08; 
            border-right: 1px solid #332a1d; 
            display: flex; 
            flex-direction: column; 
            z-index: 10; 
        }
        .sidebar-header { 
            padding: 30px; 
            text-align: center; 
            border-bottom: 1px solid #2a2218; 
        }
        .sidebar-header h1 { 
            font-size: 1.6rem; 
            letter-spacing: 6px; 
            color: var(--gold); 
            margin: 0; 
            font-weight: 900; 
        }
        .dynasty-list { 
            flex: 1; 
            overflow-y: auto; 
            padding: 10px 0; 
        }
        .dynasty-item { 
            border-bottom: 1px solid #1f1a12; 
        }
        .dynasty-title { 
            padding: 15px 25px; 
            cursor: pointer; 
            display: flex; 
            justify-content: space-between; 
            color: #a89a80; 
            font-weight: 600; 
            transition: 0.3s; 
        }
        .dynasty-title:hover { 
            background: #1c160f; 
            color: var(--gold); 
        }
        .people-grid { 
            display: none; 
            background: #0d0a07; 
            padding: 15px; 
            flex-wrap: wrap; 
            gap: 8px;
        }
        .person-node { 
            padding: 6px 10px; 
            border: 1px solid #332a1d; 
            font-size: 0.85rem; 
            cursor: pointer; 
            color: #887a62; 
            transition: 0.3s;
        }
        .person-node:hover { 
            border-color: var(--gold); 
            color: var(--gold); 
            background: rgba(184,134,11,0.1); 
        }
        .main-content { 
            flex: 1; 
            position: relative; 
            display: flex; 
            justify-content: center; 
            align-items: center; 
            background: radial-gradient(circle, #1a150f 0%, #050403 100%); 
        }
        .welcome-text {
            color:#4a3c28;
            letter-spacing:8px;
            text-align: center;
            padding: 0 20px;
        }
        .letter-scroll { 
            position: absolute; 
            width: 85%; 
            max-width: 800px; 
            height: 90%; 
            background: var(--paper); 
            box-shadow: 0 30px 70px rgba(0,0,0,0.9); 
            padding: 60px 80px; 
            box-sizing: border-box; 
            color: var(--ink); 
            overflow-y: auto; 
            display: none; 
            opacity: 0; 
            transform: translateY(20px); 
            transition: all 0.6s ease-out; 
        }
        .letter-scroll.active { 
            display: block; 
            transform: translateY(0); 
            opacity: 1; 
        }
        .salutation { 
            font-size: 1.5rem; 
            font-weight: 900; 
            margin-bottom: 30px; 
            border-bottom: 2px solid rgba(0,0,0,0.1); 
            padding-bottom: 10px; 
        }
        .body-text { 
            font-size: 1.2rem; 
            line-height: 2.2; 
            text-align: justify; 
            white-space: pre-wrap;
        }
        .signature { 
            text-align: right; 
            margin-top: 60px; 
            font-size: 2.2rem; 
            font-family: 'Kaiti', 'STKaiti', 'Noto Serif SC', serif; 
            font-weight: 900; 
        }
        .cite-mark {
            font-size: 0.8rem;
            color: #886600;
        }
        ::-webkit-scrollbar { 
            width: 5px; 
        }
        ::-webkit-scrollbar-thumb { 
            background: var(--gold); 
        }
        @media (max-width: 768px) {
            .container { flex-direction: column; }
            .sidebar { 
                width: 100%; 
                height: 200px; 
                border-right: none; 
                border-bottom: 1px solid #332a1d; 
            }
            .letter-scroll { 
                padding: 30px 20px; 
                width: 95%; 
                height: calc(100% - 220px);
            }
            .salutation { font-size: 1.2rem; }
            .body-text { font-size: 1rem; line-height: 1.8; }
            .signature { font-size: 1.8rem; }
            .welcome-text { font-size: 0.9rem; }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="sidebar">
            <div class="sidebar-header">
                <h1>万古长空全贤邮局</h1>
            </div>
            <div class="dynasty-list" id="dynastyList"></div>
        </div>
        <div class="main-content">
            <div class="welcome-text" id="welcome">「 历史沉默不语，唯信笺尚存余温 」</div>
            <div class="letter-scroll" id="letterBox">
                <div class="salutation" id="letterTo">展信者：</div>
                <div class="body-text" id="letterBody"></div>
                <div class="signature" id="letterSign"></div>
            </div>
        </div>
    </div>

    <script>
        const domCache = {
            welcome: document.getElementById('welcome'),
            letterBox: document.getElementById('letterBox'),
            letterTo: document.getElementById('letterTo'),
            letterBody: document.getElementById('letterBody'),
            letterSign: document.getElementById('letterSign'),
            dynastyList: document.getElementById('dynastyList')
        };

        const letterDB = {
            "夏朝": {
                "大禹": "展信者：\n吾不知汝之名姓，然汝记吾，便如百川归海，吾亦感知。故提笔，书此一函，寄吾一生所思所悟。\n吾生数十年，大半光阴皆耗于治水，三过家门而不敢入，世人皆叹吾执着，甚至不解，为何要以一身之力，担天下之难。吾独不以为然。人生之重，不在安逸享乐，在于肩上所担之责，在于所为是否无愧于苍生。吾每凿一山、疏一河，皆拼尽全力，无一丝懈怠，纵身心俱疲，亦无半分悔意。如此，足矣。\n昔有人劝吾，治水非一人之事，何不解甲归田，安享天伦。吾笑而不应。洪水未平，兆民未安，何以家为？此非吾故作高尚，实乃吾之本心——尚有千万百姓流离失所，安可先图己之安逸？汝处身于后世，所遇之难或非洪水，或是生计之困，或是前路之迷，或是责任之重，然道理相同：责未尽，勿先安。\n吾治水之时，无前人之法，无现成之径，唯有踏遍千山万水，摸索前行，纵遇悬崖峭壁、惊涛骇浪，亦未敢停步。世人皆道此举鲁莽，吾道：正因无人涉足，此路方有意义；正因责任在肩，此行方不可退。汝亦然。若汝之路，皆有前人铺就，皆有旁人指引，那恐怕走的不是汝的路，而是旁人为汝安排好的路。\n吾知汝有时踌躇，有时自疑，有时觉得自己渺小如尘，世事之风一吹便散。吾亦有此刻，只是从不对人言说，吾之法，唯有一字：干。不论对错，先干起来；不论难易，先扛起来。错在前行中，远比错在原地要好得多。治水之中，退缩者溺，奋进者生。\n于九泉之下，遥望汝负重前行，不负本心。\n大禹书。",
                "启": "展信者：\n吾不知汝之名姓，然汝念吾、记吾，便如日月照心，吾亦感知。故提笔挥毫，书此一函，诉吾一生之念，寄吾一世之期许。\n吾生三十余载，承父大禹之业，废禅让、立世袭，世人皆骂吾贪权，皆叹吾打破古制，唯有吾知，吾所做之一切，皆为天下安定。人生之短，不在年岁，在于是否敢破局，在于是否能担起传承之责。吾每做一事，皆深思熟虑，纵遭千夫所指，亦未动摇，纵有万般非议，亦未退缩。如此，足矣。\n昔有人劝吾，循禅让之制，可博贤名，可避非议。吾笑而拒之。天下未定，礼制未立，若一味循旧，只会徒生纷争，百姓难安。吾立世袭，非为私念，实欲定天下秩序，传华夏根基。汝处身于后世，所遇之困或非礼制之惑，或是世俗之规，或是他人之非议，或是自我之怀疑，然道理相同：心有定见，便不惧流言；志有方向，便不畏路远。\n吾登大位之时，天下未归心，诸侯有异志，吾无前人之经验，无万全之良策，唯有以心待人、以威护民，赏罚分明、恩威并施，终使天下归一。世人皆道吾幸运，吾道：幸运从非天降，唯有敢闯敢试，敢作敢当，方能成事。汝亦然。若汝困于世俗之规，畏于他人之言，不敢坚守本心，不敢突破自我，终会沦为平庸，辜负此生。\n吾知汝有时迷茫，有时怯懦，有时觉得前路漫漫，无从下手。吾之法，唯有一字：守。守本心，不随波逐流；守志向，不轻易放弃；守底线，不违背初心。世间纷扰万千，唯有守住自己，方能行稳致远。\n于夏土之上，遥望汝坚守本心，终成所愿。\n夏后启书。",
                "少康": "展信者：\n吾不知汝之名姓，然汝记吾、念吾，便如星火传薪，吾亦感知。故提笔书此一函，寄吾一生之韧，赠汝重生之力。\n吾生坎坷，幼年失国，颠沛流离，寄人篱下，世人皆叹吾命苦，皆谓吾难成大器，吾独不以为然。人生之贵，不在出身，不在顺遂，在于是否能于绝境中奋起，在于是否能于沉沦中坚守，在于是否能不负先祖、不负苍生。吾隐匿多年，卧薪尝胆，积蓄力量，每一步皆如履薄冰，每一日皆不敢懈怠，终复国兴夏，重振先祖基业。如此，足矣。\n昔有人劝吾，安于现状，苟全性命，不必冒复国之险，不必担复兴之责。吾笑而不应。先祖基业未复，夏民未安，吾身为夏室后裔，何敢苟安？国破家亡，唯有奋起，方能雪耻；唯有坚守，方能复兴。汝处身于后世，所遇之难或非国破之痛，或是绝境之困，或是低谷之扰，或是逆袭之艰，然道理相同：境再难，不放弃；路再险，不退缩。\n吾复国之时，势单力薄，无兵无卒，无险可守，唯有依靠民心，唯有坚韧不拔，步步为营，终成大业。世人皆道吾幸运，吾道：幸运从非偶然，唯有于绝境中不低头，于困境中不放弃，方能破局重生。汝亦然。若汝遇低谷便沉沦，遇绝境便退缩，终会被困境打败，辜负自己的初心与潜能。\n吾知汝有时绝望，有时沉沦，有时觉得自己深陷泥沼，难以自拔。吾之法，唯有一字：韧。韧于志，不轻易言败；韧于行，不轻易放弃；韧于心，不轻易沉沦。绝境之中，唯有坚韧，方能破茧成蝶；低谷之中，唯有坚守，方能逆袭重生。\n于夏疆之上，遥望汝绝境奋起，终获新生。\n少康书。",
                "桀": "展信者：\n吾不知汝之名姓，然汝记吾、念吾，便如警钟入心，吾亦感知。故提笔书此一函，诉吾一生之悔，赠汝警醒之戒。\n吾生数十载，身为夏后，坐拥天下，却荒淫无道，暴虐成性，终致国破家亡，身败名裂，被世人唾骂千年。世人皆骂吾昏庸，皆叹吾亡国之过，吾无可辩驳，亦无半分怨言。人生之悲，不在身死，在于知错不改，在于恃权而骄，在于辜负苍生、辜负先祖。吾每一日沉溺享乐，每一事苛待百姓，皆为日后亡国埋下隐患，纵有后悔之心，亦难挽回。如此，悔矣。\n昔有人劝吾，勤于朝政，善待百姓，可保夏室永固，可免亡国之祸。吾嗤之以鼻，不以为然。吾曾以为，身为帝王，便可为所欲为，便可掌控天下，便可漠视苍生。直到国破家亡之日，吾才明白，民心即天下，失民心者，必失天下。汝处身于后世，所遇之诱或非帝王之权，或是名利之惑，或是安逸之诱，或是强权之纵，然道理相同：恃势而骄，必遭反噬；知错不改，必酿大错。\n吾坐拥天下之时，有良臣劝谏，有百姓期盼，却视而不见、听而不闻，一味沉溺享乐，肆意残害忠良，终致众叛亲离，孤立无援。世人皆道吾愚蠢，吾道：愚蠢不在于无知，而在于狂妄；不在于无势，而在于失心。汝亦然。若汝恃己之能，骄纵狂妄，不听劝谏，知错不改，终会一步步走向沉沦，辜负自己，辜负身边之人。\n吾知汝有时骄纵，有时狂妄，有时觉得自己无所不能，便可肆意而为。吾之戒，唯有一字：醒。醒于骄，不恃能而骄；醒于过，知错便改；醒于心，不违本心。人生在世，无完人，难免有过，唯有时刻警醒，方能不踏覆辙，方能行稳致远。\n于九泉之下，遥望汝时刻警醒，不蹈吾之覆辙。\n桀书。",
                "伯益": "展信者：\n吾不知汝之名姓，然汝记吾、念吾，便如草木知春，吾亦感知。故提笔书此一函，寄吾一生之忠，赠汝立身之则。\n吾生数十载，辅佐大禹治水，助其定九州、安万民，虽有拥立之功，却不贪权、不恋位，甘愿退居幕后，辅佐新君。世人皆赞吾贤明，皆叹吾淡泊，吾独不以为然。人生之价值，不在权位高低，不在名利多少，在于是否能尽忠职守，在于是否能辅佐明主，在于是否能为天下苍生谋福祉。吾每助大禹治水，每为百姓谋利，皆倾尽全力，无一丝私心，纵未得高位，亦无半分悔意。如此，足矣。\n昔有人劝吾，趁治水之功，谋取权位，可成一代贤相，可享万世美名。吾笑而不应。吾辅佐大禹，非为权位，非为美名，实乃心怀苍生，愿助天下安定。君子当有辅佐之心，无觊觎之念；当有赤诚之志，无自私之私。汝处身于后世，所遇之诱或非权位之惑，或是名利之扰，或是私心之念，或是欲望之诱，然道理相同：守忠心，不贪权；守本心，不自私；守底线，不逾矩。\n吾助大禹治水之时，踏遍九州，尝尽艰辛，与百姓同甘共苦，不搞特殊，不享安逸，终助大禹完成治水大业。世人皆道吾辛苦，吾道：为苍生谋利，再苦再累，亦值得；为明主辅佐，再难再险，亦无悔。汝亦然。若汝遇利益诱惑，便贪念丛生；遇责任在肩，便推诿退缩，终会失去本心，沦为欲望的奴隶。\n吾知汝有时贪念，有时自私，有时觉得自己付出太多，收获太少。吾之法，唯有一字：忠。忠于本心，不违初心；忠于责任，不推诿退缩；忠于良知，不贪不义之利。人生在世，唯有心怀赤诚，坚守忠诚，方能行稳致远，方能赢得他人敬重。\n于九州之中，遥望汝坚守忠心，不负初心。\n伯益书。",
                "皋陶": "展信者：\n吾不知汝之名姓，然汝记吾、念吾，便如明镜照心，吾亦感知。故提笔书此一函，寄吾一生之公，赠汝处事之法。\n吾生数十载，辅佐大禹、舜帝，主掌刑狱，制定法度，公正无私，不徇私情，世人皆赞吾公正，皆敬吾严明，吾独不以为然。人生之重，不在权势，不在美名，在于是否能公正处事，在于是否能明辨是非，在于是否能为天下立规矩、为百姓谋公正。吾每审一案、定一刑，皆明察秋毫，不偏不倚，纵遭人非议，亦坚守公正，无一丝徇私。如此，足矣。\n昔有人劝吾，审案之时，可徇私情，可顾人情，可谋私利，可避非议。吾笑而拒之。法度者，天下之公器也；公正者，立身之根本也。若徇私枉法，漠视法度，纵使一时得利，终会失去民心，终会遭人唾弃。汝处身于后世，所遇之困或非刑狱之事，或是处事之难，或是人情之扰，或是公正之择，然道理相同：守公正，不徇私；明是非，不盲从；立底线，不逾矩。\n吾主掌刑狱之时，不畏惧权贵，不偏袒亲友，不徇私枉法，凡有违法者，不论身份高低，皆依法处置，终使天下安定，百姓信服。世人皆道吾严苛，吾道：公正之下，无偏袒；法度之前，人人平等。唯有严苛，方能彰显公正；唯有公正，方能安抚民心。汝亦然。若汝处事之时，徇私枉法，偏袒亲友，漠视规则，终会失去他人信任，终会一事无成。\n吾知汝有时为难，有时犹豫，有时觉得人情难却，难以坚守公正。吾之法，唯有一字：公。公于心，明辨是非；公于行，不徇私情；公于志，坚守法度。人生在世，唯有坚守公正，方能立身行事，方能赢得他人敬重，方能行稳致远。\n于刑狱之堂，遥望汝公正处事，明辨是非。\n皋陶书。",
                "后羿": "展信者：\n吾不知汝之名姓，然汝记吾、念吾，便如弯弓向月，吾亦感知。故提笔书此一函，寄吾一生之勇，赠汝破局之力。\n吾生数十载，身具勇力，善射善战，曾射九日、除凶兽，救万民于水火，也曾辅夏安邦，却终因恃勇而骄，疏于防备，落得身败名裂之结局。世人皆赞吾勇武，亦皆叹吾可惜，吾独不以为然。人生之憾，不在无勇，在于恃勇而骄；不在无才，在于有才无谋。吾每射一兽、除一害，皆拼尽全力，尽显勇武，然终因狂妄自大，不听劝谏，终致悲剧。如此，憾矣，亦悟矣。\n昔有人劝吾，勇武可恃，却不可骄，当明哲保身，当虚心纳谏，可保一世安稳，可留千古美名。吾嗤之以鼻，不以为然。吾曾以为，一身勇武，便可无敌于天下，便可随心所欲，却不知，骄兵必败，狂妄必亡。汝处身于后世，所遇之境或非乱世之险，或是有才之扰，或是骄纵之惑，或是轻敌之误，然道理相同：有才不骄，有勇不躁；虚心纳谏，方能行稳。\n吾射九日之时，万众期盼，意气风发，凭一身勇武，救万民于酷热之中，世人皆敬吾畏吾。然吾却因此狂妄自大，目中无人，疏于防备，终被奸人所害，落得悲惨结局。世人皆道吾愚蠢，吾道：愚蠢不在于无勇，而在于恃勇而骄；不在于无才，而在于有才无谋。汝亦然。若汝身怀所长，便骄纵狂妄，不听劝谏，轻视他人，终会栽下跟头，辜负自己的才华与初心。\n吾知汝有时骄纵，有时轻敌，有时觉得自己身怀所长，便可随心所欲。吾之悟，唯有一字：谦。谦于心，不恃才而骄；谦于行，不轻视他人；谦于志，虚心纳谏。人生在世，唯有谦虚谨慎，方能取长补短，方能避免覆辙，方能成就大事。\n于苍穹之下，遥望汝谦而有勇，不负才华。\n后羿书。",
                "寒浞": "展信者：\n吾不知汝之名姓，然汝记吾、念吾，便如寒刃藏锋，吾亦感知。故提笔书此一函，诉吾一生之谋，赠汝警醒之思。\n吾生数十载，出身低微，却不甘平庸，凭一身智谋，步步为营，夺权篡位，坐拥天下，却终因心术不正，残暴不仁，落得身死国灭、遗臭万年之结局。世人皆骂吾奸邪，皆叹吾心狠，吾无可辩驳，却亦有一丝感悟。人生之败，不在无谋，在于心术不正；不在无才，在于不择手段。吾每一步谋划，每一次夺权，皆费尽心机，尽显智谋，然终因背离良知，残害忠良，终致众叛亲离。如此，败矣，亦悔矣。\n昔有人劝吾，谋事当守良知，夺权当凭正道，可保天下安定，可留一世美名。吾笑而拒之。吾曾以为，成大事者，不拘小节；夺天下者，不择手段。直到身死国灭之日，吾才明白，心术不正，纵有智谋，亦难长久；不择手段，纵得天下，亦会失去。汝处身于后世，所遇之困或非夺权之事，或是谋事之难，或是良知之择，或是手段之选，然道理相同：守良知，不逾矩；凭正道，成大事；心术正，方能长久。\n吾夺权之时，伪装隐忍，暗中布局，除掉异己，夺取权位，终坐拥天下。然吾掌权之后，残暴不仁，残害百姓，滥杀无辜，终致百姓反抗，众叛亲离，最终身死国灭。世人皆道吾奸邪，吾道：奸邪不在于有谋，而在于心术不正；失败不在于无才，而在于背离良知。汝亦然。若汝为达目的，不择手段，背离良知，漠视他人，终会失去一切，沦为世人唾弃之人。\n吾知汝有时急功近利，有时不择手段，有时觉得为达目的，可暂时背离良知。吾之戒，唯有一字：正。正于心，不存邪念；正于行，不做恶事；正于志，凭正道成事。人生在世，唯有心术端正，坚守良知，方能行稳致远，方能赢得他人敬重。\n于九泉之下，遥望汝心术端正，凭正道前行。\n寒浞书。",
                "杜康": "展信者：\n吾不知汝之名姓，然汝记吾、念吾，便如佳酿飘香，吾亦感知。故提笔书此一函，寄吾一生之悟，赠汝处世之智。\n吾生数十载，潜心钻研，偶然间酿成佳酿，传于后世，被世人尊为酒祖。世人皆赞吾聪慧，皆叹吾创举，吾独不以为然。人生之乐，不在名利，不在美名，在于潜心钻研，在于有所创造，在于能为世人留下一丝美好，在于能于平凡之中，活出不一样的价值。吾每一次钻研，每一次尝试，皆倾尽全力，无一丝懈怠，纵历经失败，亦未放弃，终成佳酿。如此，足矣。\n昔有人劝吾，借佳酿之名，谋取富贵，可成一方巨富，可享一世安逸。吾笑而不应。吾酿佳酿，非为富贵，非为美名，实乃兴趣所致，实乃愿为世人增添一丝乐趣。佳酿者，可助兴，可解忧，可促情谊，却不可贪多，不可沉迷。汝处身于后世，所遇之乐或非佳酿之欢，或是兴趣之悦，或是成功之喜，或是安逸之享，然道理相同：有所爱，有所专；有所乐，不沉迷；有所为，不贪求。\n吾钻研酿酒之时，历经无数次失败，尝尽无数次苦涩，却从未放弃，终摸索出酿酒之法，酿成佳酿。世人皆道吾幸运，吾道：幸运从来都是留给有耐心、肯钻研的人，唯有潜心钻研，坚持不懈，方能有所成就，方能实现自我价值。汝亦然。若汝遇一点失败便放弃，遇一点困难便退缩，终难有所成就，终会辜负自己的兴趣与初心。\n吾知汝有时浮躁，有时急于求成，有时觉得钻研太苦，难以坚持。吾之法，唯有一字：专。专于心，潜心钻研；专于行，坚持不懈；专于志，不轻易放弃。人生在世，唯有专注一事，潜心钻研，方能有所突破，方能实现自我价值，方能活出属于自己的精彩。\n于酒坊之中，遥望汝潜心钻研，终有所成。\n杜康书。",
                "仪狄": "展信者：\n吾不知汝之名姓，然汝记吾、念吾，便如清泉润心，吾亦感知。故提笔书此一函，寄吾一生之专，赠汝坚持之力。\n吾生数十载，潜心酿酒，尝百草、辨五谷，终酿出佳酿，献于大禹，虽未得大禹青睐，却将酿酒之法传于后世，被世人铭记。世人皆赞吾聪慧，皆叹吾执着，吾独不以为然。人生之价值，不在他人认可，不在美名远扬，在于有所坚守，在于有所创造，在于能于自己热爱之事上，倾尽全力，无一丝遗憾。吾每一次选材、每一次酿造，皆精心细致，无一丝敷衍，纵未得认可，亦无半分悔意。如此，足矣。\n昔有人劝吾，大禹不喜饮酒，便放弃酿酒之术，另寻出路，可谋富贵，可避困顿。吾笑而不应。吾热爱酿酒，非为取悦他人，非为谋取富贵，实乃本心所向，实乃愿将自己的钻研，留于后世。做自己热爱之事，纵使不被认可，纵使历经艰辛，亦心甘情愿。汝处身于后世，所遇之困或非不被认可，或是热爱之艰，或是坚持之难，或是他人之不解，然道理相同：守热爱，不放弃；专一事，不浮躁；顺本心，不盲从。\n吾酿酒之时，无人指引，无现成之法，唯有自己摸索，尝尽百草，历经无数次失败，终酿出佳酿。世人皆道吾固执，吾道：热爱之事，当全力以赴；心中之志，当坚守到底。唯有坚持，方能有所成就；唯有执着，方能不负热爱。汝亦然。若汝因他人不认可，便放弃自己的热爱；因历经艰辛，便退缩不前，终会失去自我，辜负自己的初心与热爱。\n吾知汝有时迷茫，有时退缩，有时觉得自己的热爱不被认可，难以坚持。吾之法，唯有一字：守。守热爱，不轻易放弃；守初心，不随波逐流；守执着，不轻易妥协。人生在世，唯有坚守自己的热爱，全力以赴，方能活出自我，方能不负此生。\n于酿坊之侧，遥望汝坚守热爱，终不负己。\n仪狄书。[cite: 108]"
            },
            "商朝": {
                "商汤": "展信者：\n吾不知汝之名姓，然汝记吾，便如烈火燃薪，吾亦感知。吾以鸣条之战覆灭夏桀 ，非吾好战，实乃夏桀无道，民不聊生。吾登大位，轻徭薄赋，与民休息，非吾仁慈，实乃知民心之重。人生之成，不在兵戈之利，而在民心之向。\n昔有人劝吾，可乘胜扩张，称霸四方。吾笑而不应。天下初定，百姓思安，若穷兵黩武，终会重蹈夏桀覆辙。汝处身于后世，所遇之争或非王朝更替，或是职场之竞，或是人际之争，或是理想之逐，然道理相同：以力服人，不如以德服人；以势压人，不如以心待人。\n吾起兵之时，势单力薄，却得天下诸侯响应，非吾兵强马壮，乃因吾顺民心、合天意。世人皆道吾天命所归，吾道：天命不在天，而在民。唯有以民为本，方能得天之佑。汝亦然。若汝行事只凭己愿，不顾他人感受；若汝逐利只看眼前，不顾长远发展，终会失道寡助，一事无成。\n吾知汝有时争强好胜，有时急于求成，有时觉得唯有强势，方能立足。吾之法，唯有一字：仁。仁于心，善待他人；仁于行，兼顾多方；仁于志，不忘初心。人生在世，唯有以仁立身，方能行稳致远，方能赢得真心相随。\n只要汝仁在心、勇在行，纵使身处绝境，亦能涅槃重生。\n商汤书。",
                "伊尹": "展信者：\n吾由厨入相，辅佐五代。治大国如烹小鲜 ，火大则焦，火小则生，唯有拿捏分寸，方能成其美味。吾一生辅政，不求锋芒毕露，只求润物无声。\n昔有人笑吾出身卑微，不配居宰辅之位。吾笑而不语。吾以厨艺悟治国之道：食材有别，需因材施烹；百姓有差，需因势导之。无高低贵贱之分，唯有适配与否之别。汝处身于后世，所遇之困或非出身之限，或是学历之囿，或是经验之缺，或是身份之卑，然道理相同：出身定起点，格局定终点。\n吾辅商汤灭夏，辅太甲复位，非吾权欲熏心，乃因吾知治国如烹鲜，不可操之过急，不可放任自流。世人皆道吾智计过人，吾道：智慧不在巧言，而在分寸；能力不在张扬，而在精准。汝亦然。若汝行事不知进退，不懂分寸，纵使才华横溢，亦难成大事；若汝待人不分场合，不懂变通，纵使真心实意，亦难获认可。\n吾知汝有时急于表现，有时不懂收敛，有时觉得唯有张扬，方能彰显价值。吾之法，唯有一字：度。度于心，知进退；度于行，知轻重；度于言，知缓急。人生在世，唯有把握分寸，方能游刃有余，方能成就大事。\n人生之才，不在出身，而在格局。细微处见真章，方为宰辅之才。\n伊尹书。",
                "盘庚": "展信者：\n吾力主迁殷，以避水患，以振纲常 ，百官反对，百姓怨怼，吾力排众议，终成迁都大业。非吾刚愎自用，乃因知不变则亡，不迁则衰。\n昔有人劝吾，安于旧都，可保一时安稳，可避百姓非议。吾笑而拒之。旧都水患连年，朝纲不振，若一味求稳，终会国破家亡。汝处身于后世，所遇之困或非迁都之难，或是转行之艰，或是换境之苦，或是变革之阻，然道理相同：安于现状，终被淘汰；勇于变革，方能新生。\n吾迁都之时，晓之以理，动之以情，示之以威，终使百官归心，百姓从命。世人皆道吾强硬，吾道：强硬不在态度，而在决心；成功不在顺境，而在坚持。汝亦然。若汝遇阻力便退缩，遇非议便放弃，纵使方向正确，亦难成事；若汝见困难便逃避，见挑战便低头，纵使机会在前，亦难把握。\n吾知汝有时畏惧改变，有时安于舒适，有时觉得现状虽差，却也安稳。吾之法，唯有一字：变。变于心，不惧未知；变于行，不畏艰难；变于志，不守陈规。人生在世，唯有勇于变革，方能破局重生，方能跟上时代。\n若见前路死局，当有断腕之勇。变则通，通则久。\n盘庚书。",
                "武丁": "展信者：\n吾生于王室，然幼时被父王送往民间，与百姓同劳作、共甘苦 。吾知稼穑之难，知民生之苦，登大位后，方能体恤民情，励精图治。\n昔有人劝吾，王者当居深宫，享荣华富贵，不必亲力亲为。吾笑而不应。不接地气，何以知民之所需；不历艰辛，何以懂国之所急。汝处身于后世，所遇之困或非民间之苦，或是基层之艰，或是实践之缺，或是体验之少，然道理相同：向下扎根，方能向上生长。\n吾举傅说于版筑之间，拔甘盘于市井之中，非吾标新立异，乃因吾知人才不问出身，能力不分贵贱。世人皆道吾知人善任，吾道：识人不在身份，而在才干；用人不在虚名，而在实效。汝亦然。若汝识人只看标签，用人只看背景，纵使身边人才济济，亦难尽其用；若汝做事只看表面，不重实际，纵使看似光鲜亮丽，亦难有实效。\n吾知汝有时眼高手低，有时轻视基层，有时觉得唯有身居高位，方能施展才华。吾之法，唯有一字：实。实于心，脚踏实地；实于行，注重实效；实于志，不务虚名。人生在世，唯有求真务实，方能根基稳固，方能成就大业。\n向下扎根，方能向上开花。只要汝心中有民、脚下有土，纵使身处版筑，亦能成就盛世之功。\n武丁书。",
                "妇好": "展信者：\n吾为王后，亦为将军。吾披坚执锐，平定四方 ，非吾好战，乃因国难当头，吾岂能坐视不理。世人皆谓女子当相夫教子，吾偏要执斧披甲，保家卫国。\n昔有人劝吾，女子柔弱，不宜征战，当安居后宫，享荣华富贵。吾笑而拒之。强弱不在性别，而在心志；成败不在出身，而在勇气。汝处身于后世，所遇之困或非征战之险，或是性别之限，或是偏见之阻，或是自我之疑，然道理相同：打破偏见，方能活出自我；坚守本心，方能成就不凡。\n吾领兵作战，身先士卒，赏罚分明，终得将士之心，战无不胜。世人皆道吾幸运，吾道：幸运不在性别，而在能力；成功不在偏袒，而在付出。汝亦然。若汝被世俗偏见所困，被他人评价所扰，纵使身怀绝技，亦难施展；若汝因自我怀疑而退缩，因他人非议而放弃，纵使机会在前，亦难把握。\n吾知汝有时被偏见所困，有时自我怀疑，有时觉得自己难以突破世俗的束缚。吾之法，唯有一字：敢。敢于心，不惧偏见；敢于行，突破束缚；敢于志，坚持自我。人生在世，唯有敢于突破，方能活出真我，方能成就不凡。\n世人道女子柔弱，吾以战斧告之：巾帼不让须眉。不被定义，方能活出真我。\n妇好书。",
                "纣王": "展信者：\n吾不知汝之名姓，然汝记吾，便如鹿台烈火，吾亦感知。吾坐拥天下，却终致国破家亡，非吾无能，乃因吾不愿被旧礼所缚，不愿被旧臣所制。\n昔有人劝吾，循规蹈矩，善待诸侯，可保江山永固。吾嗤之以鼻。吾为天子，岂能受制于他人；吾掌乾坤，岂能拘泥于旧礼。直到鹿台自焚之日，吾才明白，自由不在放纵，而在自律；权力不在任性，而在责任。汝处身于后世，所遇之困或非王权之纵，或是自由之惑，或是责任之重，或是约束之烦，然道理相同：放纵自由，终会失去自由；漠视责任，终会失去一切。\n吾宠妲己，杀比干，囚箕子，非吾昏庸，乃因吾想打破旧制，重塑朝纲，却终因操之过急，失之偏颇，终致众叛亲离。世人皆道吾残暴，吾道：残暴不在手段，而在初心；失败不在变革，而在方法。汝亦然。若汝为求自由而放纵，为求变革而鲁莽，纵使初心美好，亦难成善果；若汝为避约束而漠视规则，为求突破而不择手段，纵使一时痛快，亦难长久。\n吾知汝有时渴望自由，有时不愿被约束，有时觉得规则束缚了你的发展。吾之戒，唯有一字：控。控于心，不纵欲望；控于行，不越底线；控于志，不违初心。人生在世，唯有懂得控制，方能真正自由；唯有坚守底线，方能行稳致远。\n朕只是不愿受制于旧礼。然失民心者失天下。若汝一味孤行，纵有通天之能，亦难挽颓局。\n纣王书。",
                "比干": "展信者：\n吾以忠谏死，剖心以证清白。吾非不知死之将至，乃因知为人臣者，当以死谏君，当以忠报国。\n昔有人劝吾，明哲保身，少说多做，可保性命无忧。吾笑而不应。食君之禄，当担君之忧；受国之恩，当尽国之忠。若见君有错而不言，见国有难而不救，纵使苟活于世，亦无颜面见列祖列宗。汝处身于后世，所遇之困或非死谏之险，或是直言之难，或是忠言逆耳，或是明哲保身，然道理相同：坚守本心，方能无愧于心；敢于直言，方能不负所托。\n吾直言进谏，不惧生死，非吾鲁莽，乃因吾知忠言虽逆耳，却能救君救国。世人皆道吾愚蠢，吾道：愚蠢不在直言，而在盲从；勇敢不在苟活，而在坚守。汝亦然。若汝为求自保而盲从，为避麻烦而沉默，纵使一时安稳，亦难心安；若汝因害怕得罪人而不说真话，因畏惧后果而放弃原则，纵使看似周全，亦难无愧。\n吾知汝有时为求安稳而沉默，有时因怕得罪人而不说真话，有时觉得明哲保身才是上策。吾之法，唯有一字：直。直于心，坚守原则；直于行，敢于直言；直于志，无愧于心。人生在世，唯有敢于直言，方能坚守本心；唯有坚守原则，方能赢得敬重。\n人无信不立，臣无忠不存。纵使真话难听，亦不可丢了那份血性。\n比干书。",
                "微子": "展信者：\n吾不忍见商亡，先抱祭器归周。吾非不忠，乃因知大厦将倾，非一木可支；国之将亡，非一人可救。吾唯愿保存商之祭祀，延续商之血脉。\n昔有人骂吾不忠，骂吾叛国。吾笑而不语。忠不在愚忠，而在保全；义不在死守，而在传承。若为虚名而亡，为忠烈而死，却使宗庙断绝，百姓遭殃，此等忠烈，有何意义？汝处身于后世，所遇之困或非亡国之痛，或是取舍之难，或是坚守之惑，或是变通之疑，然道理相同：懂得变通，方能保全根本；懂得取舍，方能延续希望。\n吾归周之后，仍守商之礼，传商之俗，终使商之血脉得以延续，商之文化得以保存。世人皆道吾懦弱，吾道：懦弱不在变通，而在放弃；勇敢不在死守，而在传承。汝亦然。若汝为求虚名而固执，为求完美而强求，纵使看似坚守，亦难保全根本；若汝因不懂变通而错失机会，因不会取舍而满盘皆输，纵使付出再多，亦难有收获。\n吾知汝有时过于固执，有时不懂变通，有时觉得唯有死守，方能彰显忠诚。吾之法，唯有一字：舍。舍于心，放下执念；舍于行，懂得变通；舍于志，保全根本。人生在世，唯有懂得取舍，方能行稳致远；唯有懂得变通，方能延续希望。\n人生之择，不在名节之全，而在苍生之续。当识大体、明大义。\n微子书。",
                "箕子": "展信者：\n吾披发佯狂，终走朝鲜。吾传《洪范》九畴，非吾贪生，乃因知文化之重，知传承之要。国可亡，文化不可亡；朝可灭，精神不可灭。\n昔有人劝吾，以死殉国，可留忠烈之名。吾笑而拒之。死易，生难；殉国易，传承难。若吾一死了之，商之文化、商之智慧，何以传于后世？汝处身于后世，所遇之困或非亡国之痛，或是传承之难，或是坚守之苦，或是放弃之易，然道理相同：活着，方能传承；坚守，方能延续。\n吾走朝鲜，仍传商之礼，授商之学，终使商之文化得以远播，商之智慧得以传承。世人皆道吾贪生，吾道：贪生不在苟活，而在责任；勇敢不在赴死，而在坚守。汝亦然。若汝遇困难便放弃，遇挫折便逃避，纵使看似解脱，亦难完成使命；若汝因一时之痛而放弃传承，因一时之难而忘记责任，纵使看似轻松，亦难有价值。\n吾知汝有时觉得放弃很易，坚守很难，有时觉得一时的解脱比长久的责任更重要。吾之法，唯有一字：传。传于心，不忘根本；传于行，坚守使命；传于志，延续希望。人生在世，唯有懂得传承，方能不负前人；唯有坚守使命，方能成就价值。\n人生之痛，莫过于眼见国破。即便遭遇巨变，亦要守住文化的根脉。\n箕子书。",
                "傅说": "展信者：\n吾起于奴隶，筑墙于版筑 [cite: 34]。吾非不知身份之卑，乃因知才华之重，知机遇之要。纵使身处底层，亦不妄自菲薄；纵使历经艰辛，亦不放弃希望。\n昔有人笑吾出身卑微，难成大器。吾笑而不语。出身定起点，却定不了终点；境遇定当下，却定不了未来。汝处身于后世，所遇之困或非奴隶之卑，或是出身之限，或是境遇之难，或是自我之弃，然道理相同：不自弃，方能得天助；不放弃，方能遇良机。\n吾被武丁举于版筑之间，辅国安邦，终成一代贤相。世人皆道吾幸运，吾道：幸运不在出身，而在坚持；成功不在机遇，而在准备。汝亦然。若汝因出身而自弃，因境遇而放弃，纵使机遇在前，亦难把握；若汝因自卑而退缩，因困难而低头，纵使才华横溢，亦难施展。\n吾知汝有时因出身而自卑，有时因境遇而自弃，有时觉得自己难以改变命运。吾之法，唯有一字：立。立于心，不妄自菲薄；立于行，不放弃努力；立于志，不忘记初心。人生在世，唯有自立自强，方能改变命运；唯有坚持不懈，方能遇见机遇。\n人生之幸，在于得遇知音。即便身处底层，亦不可妄自菲薄。只要你有济世之才，终有天子临门之日。\n傅说书。"
            },
            "西周": {
                "周文王": "展信者：\n吾不知汝之名姓，然汝记吾、念吾，便如仁德入心，吾亦感知。吾居西岐，积善累德，广纳贤才，非吾求名，乃因知仁德之重，知民心之要。\n吾被囚羑里，演《周易》，非吾认命，乃因知困境之中，亦有生机；磨难之中，亦有智慧。昔有人劝吾，屈膝称臣，可免牢狱之苦。吾笑而不应。宁为玉碎，不为瓦全；宁守仁德，不违本心。汝处身于后世，所遇之困或非牢狱之苦，或是困境之难，或是妥协之诱，或是坚守之艰，然道理相同：守仁德，方能得人心；守本心，方能行稳致远。\n吾治西岐，轻徭薄赋，与民休息，终得民心所向，诸侯来归。世人皆道吾天命所归，吾道：天命不在天，而在德；民心不在势，而在仁。汝亦然。若汝为求利益而失德，为求成功而违心，纵使一时得利，亦难长久；若汝为避困难而妥协，为求安稳而放弃，纵使看似轻松，亦难心安。\n吾知汝有时为求利益而失德，有时为避困难而妥协，有时觉得仁德在当下并无大用。吾之法，唯有一字：仁。仁于心，善待他人；仁于行，兼顾多方；仁于志，坚守本心。人生在世，唯有以仁立身，方能赢得真心；唯有坚守本心，方能成就大业。\n守仁德，不贪功。于西岐之上，遥望汝心怀仁德，笃行致远。\n周文王书。",
                "周武王": "展信者：\n吾不知汝之名姓，然汝记吾、念吾，便如义旗所向，吾亦感知。吾率诸侯伐纣，非吾好战，乃因商纣无道，民不聊生。吾举义旗，顺天意，合民心。\n吾孟津观兵，暂不伐纣，非吾胆怯，乃因知时机未到，不可妄动。昔有人劝吾，乘势而起，速战速决。吾笑而拒之。成事不在速度，而在时机；成功不在鲁莽，而在准备。汝处身于后世，所遇之困或非伐纣之险，或是时机之择，或是准备之缺，或是冲动之误，然道理相同：审时度势，方能把握良机；做好准备，方能一举成功。\n吾牧野之战，以少胜多，终灭商朝，非吾兵强马壮，乃因吾顺民心、合天意，将士用命，百姓支持。世人皆道吾幸运，吾道：幸运不在兵力，而在民心；成功不在勇猛，而在正义。汝亦然。若汝行事不看时机，不顾民心，纵使实力强大，亦难成功；若汝做事缺乏准备，仅凭冲动，纵使机会在前，亦难把握。\n吾知汝有时急于求成，有时缺乏准备，有时觉得只要勇猛，便能成功。吾之法，唯有一字：时。时于心，审时度势；时于行，把握良机；时于志，顺势而为。人生在世，唯有懂得时机，方能事半功倍；唯有做好准备，方能一举成功。\n敢担当，不推诿。于西周疆土，遥望汝勇担使命，顺天而行。\n周武王书。",
                "周公旦": "展信者：\n吾不知汝之名姓，然汝记吾、念吾，便如礼乐传心，吾亦感知。吾辅成王，制礼作乐，非吾好权，乃因知礼乐之重，知秩序之要。\n吾摄政称王，遭人非议，非吾贪位，乃因知成王年幼，国不可无主；天下初定，不可无治。昔有人劝吾，还政成王，可避非议。吾笑而不应。为国分忧，不计个人得失；为民谋利，不惧他人非议。汝处身于后世，所遇之困或非摄政之难，或是责任之重，或是非议之扰，或是得失之患，然道理相同：担责任，方能成大事；舍小我，方能成大我。\n吾还政成王，归隐封地，非吾退缩，乃因知功成身退，方为智者；知进退有度，方为君子。世人皆道吾贤明，吾道：贤明不在贪位，而在知退；智慧不在张扬，而在低调。汝亦然。若汝贪功恋位，不知进退，纵使一时风光，亦难善终；若汝计较得失，不愿付出，纵使看似聪明，亦难成大事。\n吾知汝有时贪功恋位，有时计较得失，有时觉得付出太多，收获太少。吾之法，唯有一字：让。让于心，不计得失；让于行，懂得进退；让于志，坚守初心。人生在世，唯有懂得退让，方能行稳致远；唯有不计得失，方能成就大业。\n守本心，不逾矩。于洛邑之中，遥望汝坚守本心，不负所托。\n周公旦书。",
                "姜子牙": "展信者：\n吾不知汝之名姓，然汝记吾、念吾，便如渭水知鱼，吾亦感知。吾垂钓渭水，非吾闲散，乃因知时机未到，不可强求；知遇明主，方能施展。\n吾年逾七旬，方遇文王，非吾幸运，乃因吾从未放弃，从未懈怠。昔有人笑吾年老，难成大器。吾笑而不语。有志不在年高，无志空活百岁；有才不在年少，无才枉活一生。汝处身于后世，所遇之困或非年老之限，或是年龄之惑，或是等待之苦，或是放弃之易，然道理相同：不放弃，方能遇良机；有准备，方能展才华。\n吾辅文王、武王，灭商建周，非吾能逆天改命，乃因吾数十年如一日，勤学不辍，厚积薄发。世人皆道吾幸运，吾道：幸运不在偶遇，而在准备；成功不在年少，而在坚持。汝亦然。若汝因年龄而自弃，因等待而放弃，纵使机遇在前，亦难把握；若汝因一时之挫而懈怠，因一时之难而退缩，纵使才华横溢，亦难施展。\n吾知汝有时因年龄而焦虑，有时因等待而烦躁，有时觉得自己错过了最好的时机。吾之法，唯有一字：等。等于心，不骄不躁；等于行，做好准备；等于志，不忘初心。人生在世，唯有懂得等待，方能遇见良机；唯有坚持不懈，方能厚积薄发。\n沉得住气，方能成得了事。于渭水之畔，遥望汝沉心蓄力，静待花开。\n姜子牙书。",
                "周成王": "展信者：\n吾不知汝之名姓，然汝记吾、念吾，便如承志前行，吾亦感知。吾年幼登基，赖周公辅佐，非吾无能，乃因知学习之重，知传承之要。\n吾亲政之后，循周公之教，守文武之业，非吾盲从，乃因知前人之智，知经验之贵。昔有人劝吾，改弦更张，彰显己能。吾笑而不应。虚心学习，方能增长才干；传承前人，方能成就大业。汝处身于后世，所遇之困或非亲政之难，或是学习之苦，或是传承之重，或是创新之疑，然道理相同：学前人，方能站得更高；承传统，方能走得更远。\n吾营建成周，安定四方，非吾一人之功，乃因吾善于纳谏，善于用人。世人皆道吾贤明，吾道：贤明不在独断，而在纳谏；智慧不在自用，而在用人。汝亦然。若汝刚愎自用，不愿学习，纵使身居高位，亦难成事；若汝轻视前人，不懂传承，纵使看似创新，亦难长久。\n吾知汝有时刚愎自用，有时轻视前人，有时觉得自己无所不能，不必学习他人。吾之法，唯有一字：学。学于心，虚心求教；学于行，取长补短；学于志，传承创新。人生在世，唯有虚心学习，方能不断进步；唯有懂得传承，方能创新发展。\n虚心学，不骄纵。于西周宫廷，遥望汝虚心好学，承志前行。\n周成王书。",
                "周康王": "展信者：\n吾不知汝之名姓，然汝记吾、念吾，便如守成致远，吾亦感知。吾承父祖之业，守成康之治，非吾无志，乃因知守成之难，知安稳之要。\n吾在位之时，息兵养民，轻徭薄赋，非吾懦弱，乃因知百姓思安，天下思定。昔有人劝吾，开疆拓土，彰显武功。吾笑而拒之。打天下易，守天下难；创基业易，保基业难。汝处身于后世，所遇之困或非守成之难，或是维稳之重，或是进取之惑，或是坚守之苦，然道理相同：守成果，方能稳发展；知满足，方能得安宁。\n吾治天下，循规蹈矩，不妄作为，终成成康之治，非吾无能，乃因知稳中求进，方为上策；知循序渐进，方为大道。世人皆道吾平庸，吾道：平庸不在守成，而在无为；伟大不在张扬，而在坚守。汝亦然。若汝好高骛远，急于求成，纵使看似进取，亦难稳发展；若汝轻视守成，一味冒进，纵使看似风光，亦难长久。\n吾知汝有时好高骛远，有时急于求成，有时觉得守成就是平庸，唯有进取才是英雄。吾之法，唯有一字：守。守于心，坚守初心；守于行，稳中求进；守于志，不妄作为。人生在世，唯有懂得坚守，方能稳发展；唯有稳中求进，方能行稳致远。\n持初心，不松懈。于西周疆土，遥望汝坚守初心，持稳前行。\n周康王书。",
                "召公": "展信者：\n吾不知汝之名姓，然汝记吾、念吾，便如忠勤传世，吾亦感知。吾辅文、武、成、康，四朝元老，非吾贪位，乃因知忠勤之重，知责任之要。\n吾巡行乡里，听讼于棠树之下，非吾作秀，乃因知百姓之苦，知民间之难。昔有人劝吾，居庙堂之高，不必亲力亲为。吾笑而不应。知民间疾苦，方能治国有方；懂百姓需求，方能为民谋利。汝处身于后世，所遇之困或非巡行之难，或是基层之重，或是脱离群众，或是高高在上，然道理相同：接地气，方能知实情；亲百姓，方能得民心。\n吾一生忠勤，鞠躬尽瘁，非吾不知疲倦，乃因知食君之禄，当担君之忧；受民之托，当解民之难。世人皆道吾贤明，吾道：贤明不在高位，而在忠勤；智慧不在权谋，而在务实。汝亦然。若汝高高在上，脱离群众，纵使身居要职，亦难有作为；若汝贪图安逸，不愿付出，纵使看似聪明，亦难成大事。\n吾知汝有时高高在上，有时贪图安逸，有时觉得不必亲力亲为，自有他人代劳。吾之法，唯有一字：勤。勤于心，不忘责任；勤于行，亲力亲为；勤于志，忠勤为民。人生在世，唯有勤奋务实，方能得民心；唯有亲力亲为，方能有作为。\n忠职守，不推诿。于陕以西之地，遥望汝忠勤履职，清正前行。\n召公书。",
                "毕公": "展信者：\n吾不知汝之名姓，然汝记吾、念吾，便如辅政安邦，吾亦感知。吾辅成王、康王，安定四方，非吾好权，乃因知辅政之重，知团结之要。\n吾与周公、召公共辅成王，非吾无能，乃因知独木难支，众擎易举；知团结协作，方能成大事。昔有人劝吾，独掌大权，彰显己能。吾笑而拒之。辅政不在专权，而在协作；成功不在独断，而在同心。汝处身于后世，所遇之困或非辅政之难，或是协作之重，或是独断之惑，或是团队之疑，然道理相同：懂协作，方能成大事；知同心，方能稳发展。\n吾治理东都，安抚殷民，非吾一人之功，乃因吾善于倾听，善于包容。世人皆道吾贤明，吾道：贤明不在专断，而在包容；智慧不在自用，而在用人。汝亦然。若汝刚愎自用，不愿协作，纵使才华横溢，亦难成大事；若汝排斥异己，不懂包容，纵使看似强大，亦难长久。\n吾知汝有时刚愎自用，有时排斥异己，有时觉得自己无所不能，不必依靠他人。吾之法，唯有一字：和。和于心，包容他人；和于行，团结协作；和于志，同心同德。人生在世，唯有懂得团结，方能成大事；唯有懂得包容，方能行稳致远。\n辅明主，不贪权。于西周宫廷，遥望汝同心辅政，不负初心。\n毕公书。",
                "周厉王": "展信者：\n吾不知汝之名姓，然汝记吾、念吾，便如警钟长鸣，吾亦感知。吾贪财好利，压制言论，终致国人暴动，流亡彘地，非吾无能，乃因知贪婪之害，知民声之要。\n吾专利山川，敛财自肥，非吾贪财，乃因吾想富国强兵，却终因方法不当，失之偏颇。昔有人劝吾，轻徭薄赋，善待百姓，可保江山永固。吾嗤之以鼻。吾为天子，岂能受制于百姓；吾掌乾坤，岂能听任非议。直到流亡彘地之日，吾才明白，财富不在敛取，而在共享；权力不在压制，而在倾听。汝处身于后世，所遇之困或非专利之害，或是贪婪之惑，或是倾听之难，或是压制之误，然道理相同：贪得无厌，终会失去一切；压制民声，终会众叛亲离。\n吾防民之口，甚于防川，非吾愚蠢，乃因吾不愿听逆耳之言，不愿受他人约束。世人皆道吾残暴，吾道：残暴不在手段，而在心态；失败不在贫穷，而在贪婪。汝亦然。若汝贪得无厌，不知满足，纵使家财万贯，亦难心安；若汝压制不同声音，不愿倾听他人，纵使看似强势，亦难长久。\n吾知汝有时贪得无厌，有时不愿倾听，有时觉得自己的想法才是正确的，不必听他人之言。吾之戒，唯有一字：戒。戒于心，不贪不婪；戒于行，善于倾听；戒于志，不骄不躁。人生在世，唯有懂得戒贪，方能心安；唯有善于倾听，方能行稳。\n醒于贪婪，不贪得无厌。于彘地之上，遥望汝时刻警醒，不蹈吾之覆辙。\n周厉王书。",
                "周幽王": "展信者：\n吾不知汝之名姓，然汝记吾、念吾，便如亡国之叹，吾亦感知。吾烽火戏诸侯，宠褒姒，废申后，终致犬戎破镐京，身死国灭，非吾无能，乃因知荒淫之害，知责任之要。\n吾为博褒姒一笑，烽火戏诸侯，非吾愚蠢，乃因吾沉迷美色，忽视责任。昔有人劝吾，勤于朝政，善待诸侯，可保江山永固。吾嗤之以鼻。人生苦短，当及时行乐；天子之尊，当随心所欲。直到身死国灭之日，吾才明白，享乐不在放纵，而在有度；责任不在口头，而在行动。汝处身于后世，所遇之困或非亡国之痛，或是享乐之惑，或是责任之重，或是放纵之误，然道理相同：沉迷享乐，终会失去一切；忽视责任，终会自食恶果。\n吾废长立幼，废申后立褒姒，非吾无情，乃因吾任性而为，不顾礼法。世人皆道吾昏庸，吾道：昏庸不在无知，而在放纵；失败不在贫穷，而在失责。汝亦然。若汝沉迷享乐，忽视责任，纵使看似快乐，亦难长久；若汝任性而为，不顾后果，纵使一时痛快，亦难善终。\n吾知汝有时沉迷享乐，有时忽视责任，有时觉得及时行乐才是人生真谛。吾之戒，唯有一字：节。节于心，不纵欲望；节于行，坚守责任；节于志，不妄作为。人生在世，唯有懂得节制，方能行稳致远；唯有坚守责任，方能成就人生。\n戒荒淫，不沉迷。于骊山之下，遥望汝戒骄戒躁，坚守责任。\n周幽王书。"
            },

                "孔子": "展信者：\n吾不知汝之名姓，然汝记吾、念吾，便如仁礼传心，吾亦感知 。吾周游列国，传仁布礼，非吾好名，乃因知仁礼之重，知教化之要。\n吾困于陈蔡，绝粮七日，非吾认命，乃因知坚守之重，知理想之要。昔有人劝吾，曲学阿世，可免困顿。吾笑而不应。宁为玉碎，不为瓦全；宁守仁礼，不违本心。汝处身于后世，所遇之困或非绝粮之苦，或是坚守之难，或是妥协之诱，或是理想之疑，然道理相同：守仁礼，方能得心安；守理想，方能行致远。\n吾删《诗》《书》，定《礼》《乐》，修《春秋》，非吾好古，乃因知文化之重，知传承之要。世人皆道吾迂腐，吾道：迂腐不在守礼，而在不知变通；智慧不在求新，而在知根本。汝亦然。若汝为求功利而失本心，为求变通而忘根本，纵使一时得利，亦难长久；若汝因困难而放弃理想，因非议而改变初心，纵使看似聪明，亦难心安。\n吾知汝有时为求功利而失本心，有时因困难而放弃理想，有时觉得仁礼在当下并无大用。吾之法，唯有一字：修。修心，不贪不躁；修行，坚守本心；修志，不忘根本。人生在世，唯有修身立德，方能行稳致远；唯有坚守理想，方能成就人生。\n修心，不贪不躁。于杏坛之上，遥望汝修身立德，行稳致远。\n孔子书。",

        // 初始化朝代列表
        function initDynasties() {
            const list = domCache.dynastyList;
            for (const dynasty in letterDB) {
                const item = document.createElement('div');
                item.className = 'dynasty-item';
                
                const title = document.createElement('div');
                title.className = 'dynasty-title';
                title.textContent = dynasty;
                
                const grid = document.createElement('div');
                grid.className = 'people-grid';
                
                // 绑定人物
                const people = letterDB[dynasty];
                for (const name in people) {
                    const node = document.createElement('div');
                    node.className = 'person-node';
                    node.textContent = name;
                    node.onclick = () => openLetter(dynasty, name);
                    grid.appendChild(node);
                }
                
                title.onclick = () => {
                    grid.style.display = grid.style.display === 'flex' ? 'none' : 'flex';
                };
                
                item.appendChild(title);
                item.appendChild(grid);
                list.appendChild(item);
            }
        }

        // 打开信件
        function openLetter(dynasty, person) {
            const data = letterDB[dynasty][person];
            domCache.welcome.style.display = 'none';
            domCache.letterBox.classList.remove('active');
            
            setTimeout(() => {
                domCache.letterBody.textContent = data;
                domCache.letterSign.textContent = person;
                domCache.letterBox.classList.add('active');
            }, 100);
        }

        // 启动
        window.onload = initDynasties;
    </script>
</body>
</html>
